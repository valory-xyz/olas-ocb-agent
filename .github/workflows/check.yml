name: check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:  # one run per PR (a new push cancels the old run); main is checked after each merge
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap  # the agent's Linux sandbox
      - name: install
        run: |
          uv venv .venv -p 3.12
          VIRTUAL_ENV=.venv uv pip install -e ".[dev]"
      - run: scripts/check.sh
  check-os:  # the same lint and tests on macOS and Windows; the 100% coverage gate is enforced on Linux (above)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: install
        run: |
          uv venv .venv -p 3.12
          VIRTUAL_ENV=.venv uv pip install -e ".[dev]"
      - name: lint and tests (no coverage gate off Linux)
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m ruff check .
          "$PY" -m ruff format --check .
          "$PY" -m pytest -q -p no:cacheprovider -n 4 --dist loadfile --no-cov -rs --durations=20
  extras:  # the install a benchmark pins, alone: LiteLLM's retry and streaming paths need nothing the extras lack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: install exactly .[litellm,facilitator] in a clean venv (no dev extra)
        run: |
          uv venv /tmp/extras -p 3.12
          VIRTUAL_ENV=/tmp/extras uv pip install ".[litellm,facilitator]"
      - name: tenacity imports, and a failed first request is retried (local fake endpoint, no network)
        run: |
          cd /tmp  # import the installed package, not the checkout
          /tmp/extras/bin/python -c "import tenacity"
          /tmp/extras/bin/python "$GITHUB_WORKSPACE/scripts/check_litellm_extra.py"
  all-checks-passed:  # the single required status check (Valory's repo policy)
    name: All checks passed
    if: always()
    needs: [check, check-os, extras]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All required checks passed."
