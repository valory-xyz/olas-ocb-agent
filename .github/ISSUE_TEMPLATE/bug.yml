name: Bug
description: Something the agent did wrong
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: {label: Version and command, description: "olas-ocb-agent version, the command, model and chain"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, description: "And what you expected. Attach the session file or log if you can; remove keys, tokens and anything from .mcp.json first."}
    validations: {required: true}
