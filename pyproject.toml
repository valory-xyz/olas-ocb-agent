[build-system]
requires = ["setuptools>=77"]  # 77: PEP 639 license expressions (license = "Apache-2.0")
build-backend = "setuptools.build_meta"

[project]
name = "olas-ocb-agent"
version = "0.1.0"
description = "A minimal agent harness for on-chain work with Pearl Connect"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Valory" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agent", "llm", "olas", "pearl", "ethereum", "safe", "mech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/valory-xyz/olas-ocb-agent"
Source = "https://github.com/valory-xyz/olas-ocb-agent"
Issues = "https://github.com/valory-xyz/olas-ocb-agent/issues"

[project.optional-dependencies]
litellm = ["litellm>=1.60", "mcp", "tenacity"]  # tenacity: LiteLLM's num_retries path imports it lazily
facilitator = ["eth-abi>=5", "eth-utils>=5", "eth-hash[pycryptodome]"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3.6", "ruff>=0.17", "olas-ocb-agent[litellm,facilitator]"]

[project.scripts]
ocb-agent = "olas_ocb_agent.cli:main"
pearl = "olas_ocb_agent.pearl_cli:main"

[tool.setuptools]
packages = ["olas_ocb_agent", "olas_ocb_agent.interim"]

[tool.setuptools.package-data]
olas_ocb_agent = ["trusted_skills.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# every run measures coverage and fails below 100% ([tool.coverage.report] fail_under): new code needs tests
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, ruff-specific, blind except, pylint warnings
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PLW"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode look-alikes in prompts/docs (DSML markup, arrows) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E501"]

[tool.coverage.run]
source = ["olas_ocb_agent"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
